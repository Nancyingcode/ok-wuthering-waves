name: Documentation

on:
  push:
    branches:
      - personal
    paths:
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: |
          python -m pip install "mkdocs-material>=9.5,<10"
          python -m pip install --no-deps ".[docs]"
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  check-pages:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check GitHub Pages configuration
        id: pages
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data: site } = await github.rest.repos.getPages(context.repo);
              const usesWorkflow = site.build_type === 'workflow';
              core.setOutput('enabled', usesWorkflow);
              if (usesWorkflow) return;
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', false);
            }

            const settingsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            core.warning('Enable GitHub Pages and select GitHub Actions as its source to publish documentation.');
            await core.summary
              .addHeading('GitHub Pages setup required')
              .addRaw(`Documentation was built and uploaded as an artifact. Enable GitHub Actions in [Pages settings](${settingsUrl}), then run this workflow again.`)
              .write();

  deploy:
    if: needs.check-pages.outputs.enabled == 'true'
    needs: [build, check-pages]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
