name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_launcher_rebuild:
        description: 'Force launcher rebuild (keep Rust / pnpm dependency caches)'
        type: boolean
        default: false
      validate_only:
        description: 'Run all Python validation shards without packaging or publishing'
        type: boolean
        default: false

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  SIGN_BUILD: 'true'
  BUILD_EXE: 'true'
#  USE_RELEASE: 'https://api.github.com/repos/ok-oldking/ok-wuthering-waves/releases/tags/v3.5.15'

jobs:
  validate:
    name: 1 · Validate (shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # job-index/job-total partition one Python version across these runners.
      matrix:
        shard: [1, 2]

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Test build and publishing tools
        run: node --test tests/test_publish_existing_build.cjs tests/test_personal_runtime_export.cjs tests/test_personal_runtime_publish.cjs tests/test_personal_launcher_cache.cjs tests/test_launcher_workflow.cjs

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt ".[dev]"

      - name: Prepare release requirements
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_ocr_wheels.py --download
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR wheel build failed' }
          python -m pip install --no-deps --force-reinstall build/ocr-wheels/patched/ok_script-2.0.22+okww.ocr1-py3-none-any.whl build/ocr-wheels/patched/onnxocr_ppocrv5-0.0.22+okww.ocr1-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR dependency check failed' }
          python scripts/prepare_ocr_release.py --tag "$env:RELEASE_TAG"

      - name: Run tests
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          ./run_tests.ps1 -ShardIndex ${{ strategy.job-index }} -ShardCount ${{ strategy.job-total }}

      - name: Upload Python validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-validation-${{ strategy.job-index }}
          path: build/python-validation/*.json
          if-no-files-found: error
          retention-days: 7

  synchronize:
    name: 2 · Synchronize repositories
    needs: validate
    runs-on: windows-latest
    outputs:
      is_release: ${{ steps.release_version.outputs.is_release }}
      start_tag: ${{ steps.sync.outputs.start_tag }}
      end_tag: ${{ steps.sync.outputs.end_tag }}
      changes: ${{ steps.sync.outputs.changes_with_asterisk }}

    steps:
      - name: Configure runner
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"

      - name: Check out source
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Prepare release requirements
        if: github.repository == 'ok-oldking/ok-wuthering-waves' && github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_ocr_wheels.py --download
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR wheel build failed' }
          python -m pip install --no-deps --force-reinstall build/ocr-wheels/patched/ok_script-2.0.22+okww.ocr1-py3-none-any.whl build/ocr-wheels/patched/onnxocr_ppocrv5-0.0.22+okww.ocr1-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR dependency check failed' }
          python scripts/prepare_ocr_release.py --tag "$env:RELEASE_TAG"

      - name: Check release version
        id: release_version
        if: env.BUILD_EXE == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      - name: Synchronize update repositories
        id: sync
        if: github.repository == 'ok-oldking/ok-wuthering-waves' && github.event_name == 'push'
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/ok-oldking/ok-wuthering-waves.git
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/ok-oldking/ok-ww-update2.git
            https://ok-oldking:${{ secrets.OK_GH }}@github.com/ok-oldking/ok-ww-update
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

  package:
    name: 3 · Build and optionally sign
    needs: synchronize
    if: >-
      github.repository == 'ok-oldking/ok-wuthering-waves' &&
      (github.event_name != 'workflow_dispatch' || !inputs.validate_only)
    runs-on: windows-latest
    env:
      SIGN_BUILD: ${{ needs.synchronize.outputs.is_release == 'true' && github.repository == 'ok-oldking/ok-wuthering-waves' }}

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Prepare release requirements
        if: github.repository == 'ok-oldking/ok-wuthering-waves' && github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/build_ocr_wheels.py --download
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR wheel build failed' }
          python -m pip install --no-deps --force-reinstall build/ocr-wheels/patched/ok_script-2.0.22+okww.ocr1-py3-none-any.whl build/ocr-wheels/patched/onnxocr_ppocrv5-0.0.22+okww.ocr1-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Patched OCR dependency check failed' }
          python scripts/prepare_ocr_release.py --tag "$env:RELEASE_TAG"

      - name: Reuse base executable
        id: reuse_executable
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.USE_RELEASE != '' && github.repository == 'ok-oldking/ok-wuthering-waves'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          use_release: ${{ env.USE_RELEASE }}

      - name: Build portable executable
        id: build_executable
        uses: ok-oldking/pyappify-action@master
        # The official action deletes pyappify_dist and packages the root pyappify.yml
        # (China / Global). On forks that would discard the staged Official / Personal
        # launcher, so the upstream-focused steps stay upstream-only.
        if: env.BUILD_EXE == 'true' && env.USE_RELEASE == '' && github.repository == 'ok-oldking/ok-wuthering-waves'
        with:
          build_exe_only: ${{ env.SIGN_BUILD == 'true' }}

      - name: Upload portable executable for signing
        id: upload_executable
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          name: portable-executable-to-sign
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        id: sign_executable
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '639bc6dd-9623-43cd-ac75-50a445898012'
          project-slug: 'ok-wuthering-waves'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'single-exe'
          github-artifact-id: '${{ steps.upload_executable.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve portable executable signing
        uses: fjogeleit/http-request-action@v1
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        with:
          url: 'https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/${{ steps.sign_executable.outputs.signing-request-id }}/Approve'
          method: POST
          bearerToken: '${{ secrets.SIGNPATH_API_TOKEN }}'
          contentType: application/json
          data: '{}'
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed portable executable
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && env.USE_RELEASE == ''
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_executable.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIRECTORY: ${{ steps.build_executable.outputs.exe-folder }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)

          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }

            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }

            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the portable executable.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-portable-executable.zip'
          $outputDirectory = [System.IO.Path]::GetFullPath($env:OUTPUT_DIRECTORY)
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $outputDirectory -Force

      - name: Build installers
        id: build_installers
        uses: ok-oldking/pyappify-action@master
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true' && github.repository == 'ok-oldking/ok-wuthering-waves'

      - name: Upload China installer for signing
        id: upload_china_installer
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          name: china-installer-to-sign
          path: pyappify_dist/ok-ww-win32-China-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign China installer
        id: sign_china_installer
        uses: signpath/github-action-submit-signing-request@v2.2
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '639bc6dd-9623-43cd-ac75-50a445898012'
          project-slug: 'ok-wuthering-waves'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'setupexe'
          github-artifact-id: '${{ steps.upload_china_installer.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve China installer signing
        uses: fjogeleit/http-request-action@v1
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        with:
          url: 'https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/${{ steps.sign_china_installer.outputs.signing-request-id }}/Approve'
          method: POST
          bearerToken: '${{ secrets.SIGNPATH_API_TOKEN }}'
          contentType: application/json
          data: '{}'
          preventFailureOnNoResponse: true
          retry: 60
          retryWait: 10000

      - name: Download signed China installer
        if: env.BUILD_EXE == 'true' && env.SIGN_BUILD == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_ID: ${{ steps.sign_china_installer.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/639bc6dd-9623-43cd-ac75-50a445898012/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $deadline = (Get-Date).AddSeconds(60000)

          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }

            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }

            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the China installer.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-china-installer.zip'
          $outputDirectory = [System.IO.Path]::GetFullPath('pyappify_dist')
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $outputDirectory -Force

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true'
        with:
          name: release-assets
          path: pyappify_dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  package_personal:
    name: 3 · Build personal launcher
    # Independent of validate: only publish joins the business/build gates.
    if: >-
      github.repository != 'ok-oldking/ok-wuthering-waves' &&
      (github.event_name != 'workflow_dispatch' || !inputs.validate_only)
    runs-on: windows-latest
    env:
      SIGN_BUILD: 'false'
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        if: env.BUILD_EXE == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node
        if: env.BUILD_EXE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust
        if: env.BUILD_EXE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'

      - name: Prepare launcher source
        if: env.BUILD_EXE == 'true'
        run: ./scripts/build_personal_launcher.ps1 -Phase Prepare -LauncherRepositoryUrl 'https://github.com/ok-oldking/pyappify.git'

      - name: Test preparation against pinned source
        if: env.BUILD_EXE == 'true'
        env:
          LAUNCHER_INTEGRATION_SOURCE: build/pyappify
        run: node --test tests/test_personal_launcher_cache.cjs

      - name: Fingerprint complete launcher inputs
        id: fingerprint
        if: env.BUILD_EXE == 'true'
        run: node scripts/personal_launcher_cache.cjs fingerprint

      - name: Restore complete launcher artifacts
        id: launcher_cache
        if: env.BUILD_EXE == 'true' && !inputs.force_launcher_rebuild
        uses: actions/cache/restore@v4
        with:
          path: build/launcher-cache
          key: ${{ steps.fingerprint.outputs.key }}

      - name: Verify complete launcher cache
        id: verify_cache
        if: env.BUILD_EXE == 'true'
        env:
          FORCE_LAUNCHER_REBUILD: ${{ inputs.force_launcher_rebuild }}
          LAUNCHER_CACHE_HIT: ${{ steps.launcher_cache.outputs.cache-hit }}
        run: node scripts/personal_launcher_cache.cjs verify

      - name: Restore pnpm dependencies
        id: pnpm_cache
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: build/pyappify/pnpm-lock.yaml

      - name: Restore Rust dependencies
        id: rust_cache
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Replaces the implicit job key; toolchain/manifest hashes remain.
          shared-key: personal-launcher
          workspaces: build/pyappify/src-tauri -> target

      - name: Build frontend and launcher
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true'
        run: ./scripts/build_personal_launcher.ps1 -Phase Build

      - name: Test launcher profiles
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true'
        run: ./scripts/build_personal_launcher.ps1 -Phase Test

      - name: Bundle installer and portable ZIP
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true'
        run: ./scripts/build_personal_launcher.ps1 -Phase Bundle

      - name: Record tested launcher artifacts
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true'
        run: node scripts/personal_launcher_cache.cjs manifest

      - name: Save tested launcher artifacts
        if: env.BUILD_EXE == 'true' && steps.verify_cache.outputs.reuse_launcher != 'true' && steps.launcher_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/launcher-cache
          key: ${{ steps.fingerprint.outputs.key }}

      - name: Stage verified release assets
        if: env.BUILD_EXE == 'true'
        run: node scripts/personal_launcher_cache.cjs stage

      - name: Upload release assets
        if: env.BUILD_EXE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            pyappify_dist/ok-ww-personal-win32-setup.exe
            pyappify_dist/ok-ww-personal-win32.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Write launcher summary
        if: always() && env.BUILD_EXE == 'true'
        env:
          RUST_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          WORKFLOW_STEPS: ${{ toJSON(steps) }}
        run: node scripts/personal_launcher_cache.cjs summary

      - name: Upload launcher metadata
        if: always() && env.BUILD_EXE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-metadata
          path: build/launcher-metadata/*.json
          if-no-files-found: warn
          retention-days: 7

  report_personal:
    name: Build timing report
    needs: [validate, synchronize, package, package_personal]
    if: always() && !cancelled() && github.repository != 'ok-oldking/ok-wuthering-waves'
    runs-on: ubuntu-latest
    steps:
      - name: Record completed jobs and action timings
        id: timings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100,
            });
            const completed = jobs.filter(job => job.status === 'completed' && /^[123] · /.test(job.name));
            const timed = completed.filter(job => Number.isFinite(Date.parse(job.started_at)) && Number.isFinite(Date.parse(job.completed_at)));
            const seconds = item => item.completed_at && item.started_at
              ? (Date.parse(item.completed_at) - Date.parse(item.started_at)) / 1000 : null;
            const report = {
              sha: context.sha,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              // This ends at the build/validation join; publishing/reporting may still run.
              buildValidationWallSeconds: timed.length ? (Math.max(...timed.map(j => Date.parse(j.completed_at))) - Math.min(...timed.map(j => Date.parse(j.started_at)))) / 1000 : null,
              jobs: completed.map(job => ({ name: job.name, conclusion: job.conclusion, seconds: seconds(job),
                steps: (job.steps || []).map(step => ({ name: step.name, conclusion: step.conclusion, seconds: seconds(step) })) })),
            };
            const filename = path.join(process.env.RUNNER_TEMP, 'launcher-run-timings.json');
            fs.writeFileSync(filename, JSON.stringify(report, null, 2));
            core.setOutput('path', filename);
            await core.summary.addHeading('Build / validation timings')
              .addLink('Source run (full workflow wall time)', report.runUrl)
              .addRaw(`\n\nBuild / validation wall time: ${report.buildValidationWallSeconds}s. Includes cache restore/save, upload and post-actions.\n\n`)
              .addCodeBlock(JSON.stringify(report, null, 2), 'json').write();

      - name: Upload run timings
        uses: actions/upload-artifact@v4
        with:
          name: launcher-run-timings
          path: ${{ steps.timings.outputs.path }}
          retention-days: 7

  publish:
    name: 4 · Publish
    # Manual builds can warm default-branch caches without creating a release.
    if: >-
      ${{ always() && !cancelled() &&
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
          needs.validate.result == 'success' && needs.synchronize.result == 'success' &&
          ((github.repository == 'ok-oldking/ok-wuthering-waves' && needs.package.result == 'success') ||
           (github.repository != 'ok-oldking/ok-wuthering-waves' && needs.package_personal.result == 'success')) }}
    needs: [validate, synchronize, package, package_personal]
    runs-on: ubuntu-latest
    concurrency:
      group: personal-runtime-publish-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out publishing tools and immutable source objects
        if: github.repository == 'Nancyingcode/ok-wuthering-waves'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Download matching launcher metadata
        if: github.repository == 'Nancyingcode/ok-wuthering-waves'
        uses: actions/download-artifact@v4
        with:
          name: launcher-build-metadata
          path: launcher-metadata

      - name: Publish Personal runtime and matching launcher release
        if: github.repository == 'Nancyingcode/ok-wuthering-waves'
        uses: actions/github-script@v7
        env:
          PERSONAL_RUNTIME_REPOSITORY: ${{ vars.PERSONAL_RUNTIME_REPOSITORY }}
          PERSONAL_RUNTIME_BRANCH: ${{ vars.PERSONAL_RUNTIME_BRANCH }}
          PERSONAL_RUNTIME_TOKEN: ${{ secrets.PERSONAL_RUNTIME_TOKEN }}
          PERSONAL_RUNTIME_MIGRATION_APPROVAL: ${{ vars.PERSONAL_RUNTIME_MIGRATION_APPROVAL }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { publishRelease } = require('./.github/scripts/publish_existing_build.cjs');
            const { isPrerelease, validateVersion } = require('./scripts/export_personal_runtime.cjs');
            const version = validateVersion(context.ref.replace('refs/tags/', ''));
            const sha = execFileSync('git', ['rev-parse', `${context.ref}^{commit}`], { encoding: 'utf8' }).trim();
            if (sha !== context.sha) throw new Error('Release tag does not match the validated business SHA');
            const source = { version, sha, runId: context.runId,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              prerelease: isPrerelease(version) };
            await publishRelease({ github, context, source, directory: 'pyappify_dist' });

      - name: Upload runtime publication evidence
        if: always() && github.repository == 'Nancyingcode/ok-wuthering-waves'
        uses: actions/upload-artifact@v4
        with:
          name: personal-runtime-publication
          path: |
            build/personal-runtime-*/runtime-report.json
            build/personal-runtime-*/payload/runtime-manifest.json
            build/personal-runtime-publication.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate and verify SHA-256 checksums
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        shell: bash
        run: |
          set -euo pipefail
          cd pyappify_dist
          mapfile -d '' assets < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' | LC_ALL=C sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets found.' >&2
            exit 1
          fi
          sha256sum -- "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        if: github.repository == 'ok-oldking/ok-wuthering-waves'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 更新日志 ${{ needs.synchronize.outputs.start_tag }} -> ${{ needs.synchronize.outputs.end_tag }}:
              ${{ needs.synchronize.outputs.changes }}
            ### 下载包说明（本仓库 / This repository）
              * [ok-ww-personal-win32-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ok-ww-personal-win32-setup.exe) 双版本启动器安装包；安装后在启动器的配置选项中选择 `Official`（官方 CNB 更新仓库）或 `Personal`（本仓库的版本标签），首次安装所选版本需要联网下载，默认保留手动更新与关闭自动启动。
              * [ok-ww-personal-win32.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ok-ww-personal-win32.zip) 免安装版；解压后运行 `ok-ww-personal.exe`，并保留同目录的 `pyappify.yml`。
            ### 校验下载文件 / Verify downloads
              * [SHA256SUMS.txt](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS.txt) 包含本次上传文件的 SHA-256；校验值在所有打包与签名步骤结束后生成。
              * Windows：运行 `Get-FileHash .\ok-ww-personal-win32-setup.exe -Algorithm SHA256`，将结果与清单中同名文件对照。Linux：在下载目录运行 `sha256sum --check SHA256SUMS.txt`。
              * 个人双版本安装包目前未做 Authenticode 数字签名。校验值用于核对文件完整性；如果文件和校验清单被同时替换，单凭 SHA-256 无法验证发布者身份。
            ### 上游官方安装包 / Upstream official installers
              * 官方 China / Global 安装包请到 [上游 Release 页面](https://github.com/ok-oldking/ok-wuthering-waves/releases/latest) 下载。
              * 不要下载自动生成的 SourceCode.zip, Do Not Download the SourceCode
            ### 如果无法下载或下载慢, 可以使用其他下载源
              * [Mirror酱下载渠道](https://mirrorchyan.com/zh/projects?rid=okww&source=ok-ww-release), 国内网页直链, 下载需要购买CD-KEY, 已有Mirror酱CD-KEY可免费下载
              * [百度网盘](https://pan.baidu.com/s/102Mh1djq2B1T-cIJhct9Gg?pwd=okww) 免费下载
              * [夸克网盘](https://pan.quark.cn/s/80730a808d0e) 免费下载
          draft: false
          prerelease: ${{ needs.synchronize.outputs.is_release != 'true' }}
          files: pyappify_dist/*

      - name: Trigger distribution workflows
        if: needs.synchronize.outputs.is_release == 'true' && github.repository == 'ok-oldking/ok-wuthering-waves'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_uploading
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note
