name: Build unsigned executable
run-name: Build unsigned executable · ${{ github.ref_name }}

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: build-executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build executable with PyAppify
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build executable
        id: build_executable
        uses: ok-oldking/pyappify-action@master
        with:
          build_exe_only: true

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v4
        with:
          name: ok-ww-unsigned-executable
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error
